<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DuoVibe - Real-Time Couple Games</title>
  <meta name="description" content="DuoVibe real-time couple and group games.">
  <link rel="stylesheet" href="features.css?v=together-sync-1">
  <link rel="stylesheet" href="style.css?v=together-sync-1">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">&hearts;</span>
        <div>
          <h1 class="logo-text">DuoVibe</h1>
          <span class="tagline">COUPLE + GROUP EDITION</span>
        </div>
      </div>
      <div class="header-actions">
        <span id="conn-status" class="status-badge offline">OFFLINE</span>
        <button id="btn-call-toggle" class="icon-btn" onclick="window.Features && window.Features.toggleCallWidget()">Call</button>
      </div>
    </header>

    <main id="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading DuoVibe...</p>
      </div>
    </main>
  </div>

  <script src="config.js?v=together-sync-1"></script>
  <script src="banks.js?v=together-sync-1"></script>
  <script src="app.js?v=together-sync-1"></script>
  <script src="features.js?v=together-sync-1"></script>
</body>
</html>
